services:
  - type: web
    name: priceiq-pro
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: OANDA_PAPER_TRADING
        value: "true"
      - key: AUTO_EXECUTE_TRADES
        value: "false"
